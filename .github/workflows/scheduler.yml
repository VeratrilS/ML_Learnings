name: Productivity Automation Scheduler

on:
  schedule:
    # Run every 5 minutes. The Vercel API will check the database to see
    # if the user's requested interval (e.g. 10m or 60m) has passed.
    - cron: '*/5 * * * *'
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  ping_vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Cron Endpoint
        run: |
          # Replace with your actual Vercel production URL if it changes
          curl -X POST https://productivity-automations.vercel.app/api/cron \
          -H "Content-Type: application/json"
