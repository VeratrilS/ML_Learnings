name: Productivity Automation Scheduler

on:
  schedule:
    # Every 5 minutes: LeetCode problem (the API enforces interval, pause and quiet hours)
    - cron: '*/5 * * * *'
    # 02:30 UTC = 8:00 AM IST: morning digest
    - cron: '30 2 * * *'
    # 13:30 UTC on Wed + Sun = 7:00 PM IST: end-sem study reminder
    - cron: '30 13 * * 0,3'
    # 14:00 UTC on Sun = 7:30 PM IST: weekly report (only sends once approved in the Beta Lab)
    - cron: '0 14 * * 0'
    # 01:30 UTC = 7:00 AM IST: live job scan of company career pages + digest email
    - cron: '30 1 * * *'
    # 01:45 UTC = 7:15 AM IST: approval email (Approve / Skip links for new matches)
    - cron: '45 1 * * *'
    # 03:30 UTC = 9:00 AM IST: application follow-up reminders (7 and 14 days after applying)
    - cron: '30 3 * * *'
  workflow_dispatch:

env:
  APP: https://productivity-automations.vercel.app

jobs:
  leetcode_cron:
    runs-on: ubuntu-latest
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Ping LeetCode cron endpoint
        run: curl -sS -X POST "$APP/api/cron" --max-time 310

  morning_digest:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 2 * * *'
    steps:
      - name: Send morning digest
        run: curl -sS -X POST "$APP/api/digest" --max-time 120

  study_reminder:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 13 * * 0,3'
    steps:
      - name: Send end-sem study reminder
        run: curl -sS -X POST "$APP/api/syllabus/remind" --max-time 120

  weekly_report:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 14 * * 0'
    steps:
      - name: Send weekly report
        run: curl -sS -X POST "$APP/api/weekly/cron" --max-time 120

  job_scan:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 1 * * *'
    steps:
      - name: Scan company career pages for new openings
        run: curl -sS -X POST "$APP/api/jobs/scan" --max-time 300

  job_followups:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 3 * * *'
    steps:
      - name: Email due application follow-ups
        run: curl -sS -X POST "$APP/api/jobs/followups" --max-time 120

  job_approval_digest:
    runs-on: ubuntu-latest
    if: github.event.schedule == '45 1 * * *'
    steps:
      - name: Email new jobs to approve or skip
        run: curl -sS -X POST "$APP/api/jobs/approval-digest" --max-time 120
